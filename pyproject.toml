[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "jj-stack"
version = "0.1.4"
description = "Stacked GitHub pull requests for Jujutsu"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
keywords = ["jj", "jujutsu", "github", "pull-requests", "stacked-pull-requests"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "httpx2>=2.12.0,<3",
  "markdown-it-py>=4.0.0,<5",
  "pydantic>=2.13.3,<3",
  "rich>=15.0.0,<16",
]

[project.urls]
Homepage = "https://www.serpentine.com/software/jj-stack/"
Documentation = "https://www.serpentine.com/software/jj-stack/"
Changelog = "https://github.com/bos/jj-stack/releases"
Repository = "https://github.com/bos/jj-stack"
Issues = "https://github.com/bos/jj-stack/issues"

[project.scripts]
jj-stack = "jj_stack.cli:main"

[dependency-groups]
dev = [
  "fastapi>=0.140.0,<0.142",
  "hypothesis>=6.167.1,<7",
  "jsonschema>=4.25.1,<5",
  "pyrefly>=1.1.1,<1.3",
  "pytest-cov>=7.1.0,<8",
  "pytest-randomly>=4.1.0,<5",
  "pytest-xdist>=3.8.0,<4",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.4,<0.17",
]
mypy = [
  "mypy>=2.3.1,<2.4",
  "types-jsonschema>=4.26.0.20260518,<5",
]
ty = [
  "ty>=0.0.70,<0.1",
  "types-jsonschema>=4.26.0.20260518,<5",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "fixed_property: fixed regressions and generated command sequences",
  "merge_recovery: bounded deterministic merge and recovery coverage",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jj_stack"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 98
src = ["src", "tests", "tools"]
target-version = "py314"

[tool.ruff.lint]
select = ["ARG", "ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyrefly]
search_path = ["src", "."]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.hatch.build]
exclude = ["/.jj", "/.tmp"]

[tool.hatch.build.targets.wheel]
packages = ["src/jj_stack"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { fastapi = false, ruff = false }
default-groups = ["dev"]
