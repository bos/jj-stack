name: nix

on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - pyproject.toml
      - uv.lock
      - skills/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - pyproject.toml
      - uv.lock
      - skills/**
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Build package
        run: nix build .#jj-stack --print-build-logs

      - name: Run the packaged command
        run: ./result/bin/jj-stack --version
