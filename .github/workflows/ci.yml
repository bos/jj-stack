name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Install tokei
        run: |
          TOKEI_VERSION="$(
            uv run --no-project --python 3.14 python -c \
              'from tools.check_complexity import TOKEI_VERSIONS; print(TOKEI_VERSIONS[-1])'
          )"
          cargo install tokei --locked --version "^$TOKEI_VERSION"

      - name: Install project environment
        run: uv sync --locked

      - name: Enforce complexity budgets
        run: uv run tools/check_complexity.py

  check:
    strategy:
      fail-fast: false
      matrix:
        jj-version: ["v0.45.1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      JJ_VERSION: ${{ matrix.jj-version }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jj
        shell: bash
        run: |
          install_dir="$(tools/install-jj-release.sh "$JJ_VERSION")"
          if command -v cygpath >/dev/null 2>&1; then
            install_dir="$(cygpath -w "$install_dir")"
          fi
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Run local verification suite
        shell: bash
        run: ./check.py

  submit-property-smoke:
    runs-on: ubuntu-latest
    env:
      JJ_VERSION: v0.45.1

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Install jj
        run: echo "$(tools/install-jj-release.sh "$JJ_VERSION")" >> "$GITHUB_PATH"

      - name: Run generated client and server sequences
        run: >-
          tests/run_submit_property_scenarios.py 5 --steps 20 --shards 8 --random-seed -n auto
