name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Install tokei
        run: |
          TOKEI_VERSION="$(
            uv run --no-project --python 3.14 python -c \
              'from tools.check_complexity import TOKEI_VERSIONS; print(TOKEI_VERSIONS[-1])'
          )"
          cargo install tokei --locked --version "^$TOKEI_VERSION"

      - name: Install project environment
        run: uv sync --locked

      - name: Enforce complexity budgets
        run: uv run tools/check_complexity.py

  check:
    strategy:
      fail-fast: false
      matrix:
        jj-version: ["v0.45.1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    env:
      JJ_VERSION: ${{ matrix.jj-version }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jj
        shell: bash
        run: |
          install_dir="$(tools/install-jj-release.sh "$JJ_VERSION")"
          if command -v cygpath >/dev/null 2>&1; then
            install_dir="$(cygpath -w "$install_dir")"
          fi
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Install current Git
        if: runner.os == 'macOS'
        # The runner image's formula list can predate the current Git release.
        run: |
          brew update
          brew install git

      - name: Check Git version
        shell: bash
        run: |
          git --version
          # Git 2.56 changed which refs a push by URL updates. Other runners keep their own
          # Git so older versions stay covered, but this one must run the newer behavior.
          if [[ "$RUNNER_OS" == macOS ]]; then
            IFS=. read -r major minor _ <<< "$(git --version | awk '{print $3}')"
            if (( major < 2 || (major == 2 && minor < 56) )); then
              echo "::error::The macOS job needs Git 2.56 or newer; found $(git --version)."
              exit 1
            fi
          fi

      - name: Run local verification suite
        shell: bash
        run: ./check.py

  submit-property-smoke:
    runs-on: ubuntu-latest
    env:
      JJ_VERSION: v0.45.1

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Install jj
        run: echo "$(tools/install-jj-release.sh "$JJ_VERSION")" >> "$GITHUB_PATH"

      - name: Run generated client and server sequences
        run: >-
          tests/run_submit_property_scenarios.py 5 --steps 20 --shards 8 --random-seed -n auto
